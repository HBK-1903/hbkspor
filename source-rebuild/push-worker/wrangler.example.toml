name = "hbkspor-push-api"
main = "src/worker.ts"
compatibility_date = "2026-10-29"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[vars]
# Set exact HTTPS origins that serve the HBK Spor app, comma-separated.
ALLOWED_ORIGINS = "https://YOUR-PAGES-HOST.pages.dev"
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "mailto:admin@example.com"

[[d1_databases]]
binding = "DB"
database_name = "hbkspor-push"
database_id = "REPLACE_WITH_ID_FROM_WRANGLER_D1_CREATE"
